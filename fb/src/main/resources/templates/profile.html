<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 40px;
        }

        .container {
            max-width: 400px;
            background: #ffffff;
            padding: 20px 25px;
            margin: auto;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 10px;
            color: #333;
        }

        p {
            margin: 6px 0;
            color: #555;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            color: #444;
        }

        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #007bff;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Profile</h2>

    <p><strong>Name:</strong>
        <span th:text="${user.firstName}"></span>
        <span th:text="${user.lastName}"></span>
    </p>

    <p><strong>Username:</strong>
        <span th:text="${user.username}"></span>
    </p>

    <h2>Edit Profile</h2>

    <form th:action="@{/profile/update}" method="post" th:object="${user}">
        <label>First Name</label>
        <input type="text"
               th:field="*{firstName}"
               placeholder="Enter your first name">


        <label>Last Name</label>
        <input type="text"
               th:field="*{lastName}"
               placeholder="Enter your last name">


        <button type="submit">Update Profile</button>
    </form>
</div>

</body>
</html>
